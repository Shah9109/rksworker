version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: workpower-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: workpower-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/workpower
      - JWT_SECRET=workpower_super_secret_jwt_key_2026
      - NODE_ENV=production
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: workpower-client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
